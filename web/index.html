<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>朋 · peng</title>
  <script>
    // 与 adapters/theme/pref.js 的 peng-theme 同一规则：已保存的选择优先，否则跟随系统。样式加载前设置，避免先闪浅色。
    (function () {
      try {
        var t = localStorage.getItem('peng-theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/base.css">

  <link rel="stylesheet" href="./styles/paper.css">
  <link rel="stylesheet" href="./styles/team.css">
  <link rel="stylesheet" href="./styles/bridge.css">
  <link rel="stylesheet" href="./styles/compare.css">
  <link rel="stylesheet" href="./styles/demo.css">

</head>

</body>
</html>
