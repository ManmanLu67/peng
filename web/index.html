<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>朋 · peng</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23C8412B'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' fill='%23F5F0E6' font-family='serif'%3E朋%3C/text%3E%3C/svg%3E">
  <script>
    // 先于渲染设好主题，避免闪烁（技术文档 3.1）：手动选择优先于系统
    (function () {
      var t = null;
      try { t = localStorage.getItem('peng-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <main id="root" tabindex="-1">
    <noscript>需要启用 JavaScript。 JavaScript is required.</noscript>
  </main>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
